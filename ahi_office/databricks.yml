# Databricks Asset Bundle: AHI office files -> medallion -> gold reporting (dev)
bundle:
  name: dp-ahi-office-data

variables:
  env:
    default: dev
  catalog:
    default: ahi_dev
  warehouse_id:
    description: SQL warehouse for the app, dashboard and Genie

sync:
  exclude:
    - tests
    - data/samples
    - "**/__pycache__"

resources:
  jobs:
    ahi_office_pipeline:
      name: ahi-office-pipeline-${var.env}
      max_concurrent_runs: 1
      queue:
        enabled: true
      trigger:                       # runs when offices upload new files
        file_arrival:
          url: /Volumes/${var.catalog}/bronze/landing/
          min_time_between_triggers_seconds: 120
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: landing_to_gold
          environment_key: default
          spark_python_task:
            python_file: ./pipeline/run_pipeline.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --landing
              - /Volumes/${var.catalog}/bronze/landing
              - --mappings
              - /Volumes/${var.catalog}/ops/mappings
              - --root
              - ${workspace.file_path}
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - openpyxl
              - pyyaml

  apps:
    ahi_upload:
      name: ahi-upload-${var.env}
      description: AHI office file upload, load status and mapping approvals
      source_code_path: ./app
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: pipeline-job
          job:
            id: ${resources.jobs.ahi_office_pipeline.id}
            permission: CAN_MANAGE_RUN

  dashboards:
    ahi_gold:
      display_name: AHI gold reporting (${var.env})
      file_path: ./dashboard/ahi_gold.lvdash.json
      warehouse_id: ${var.warehouse_id}

targets:
  dev:
    default: true
